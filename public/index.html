<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aislide - JSON to Slide</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel input">
        <h1>Aislide</h1>
        <p>Paste JSON slide instructions, preview in HTML, then export to PPTX once approved.</p>
        <textarea id="jsonInput"></textarea>
        <div class="buttons">
          <button id="previewBtn">Generate Preview</button>
          <button id="exportBtn" class="secondary" disabled>Confirm & Export PPTX</button>
        </div>
        <p id="status"></p>
      </section>

      <section class="panel preview">
        <h2>Slide Preview</h2>
        <div id="previewCanvas" class="preview-canvas"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
